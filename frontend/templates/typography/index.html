<!DOCTYPE html>
<html lang="en">
<head>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MW542D88');</script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="preload" as="image" href="/images/JOD%20Logo.png" />
    <title>Typographic</title>
    <link rel="canonical" href="https://weddingsbyjod.com/templates/typography/" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@500;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="ty" data-template-name="Typographic" data-template-slug="typography">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MW542D88"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <nav class="ty-nav">
        <a href="#story">Story</a>
        <a href="#events">When</a>
        <a href="#rsvp">RSVP</a>
    </nav>
    <p class="ty-vert" data-text="dateShort"></p>
    <header class="ty-hero">
        <h1 class="ty-a" data-text="couple.partner1"></h1>
        <p class="ty-and">&amp;</p>
        <h1 class="ty-b" data-text="couple.partner2"></h1>
        <img data-src="heroImage" alt="">
    </header>
    <section id="story" class="ty-story">
        <h2>the long sentence of us</h2>
        <p data-text="story"></p>
    </section>
    <section id="events" class="ty-when" data-repeat="events">
        <article>
            <small>{{n}}</small>
            <h3>{{item.name}}</h3>
            <p>{{item.time}}</p>
        </article>
    </section>
    <section class="ty-words" data-repeat="gallery">
        <figure>
            <img src="{{item.src}}" alt="">
            <span>{{item.caption}}</span>
        </figure>
    </section>
    <section id="rsvp" class="ty-rsvp">
        <h2>say yes</h2>
        <form class="jod-rsvp">
            <input name="name" required>
            <button type="submit">send</button>
        </form>
        <p class="jod-thanks" hidden>yes.</p>
    </section>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
