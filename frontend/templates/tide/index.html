    <title>Tide</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@400;500&display=swap" rel="stylesheet">

<body class="td" data-template-name="Tide" data-template-slug="tide">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MW542D88"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header class="td-bar">
        <strong data-text="couple.full"></strong>
        <nav>
            <a href="#story">Our story</a>
            <a href="#events">Events</a>
            <a href="#gallery">Gallery</a>
            <a href="#rsvp">RSVP</a>
        </nav>
        <a class="td-pill" href="#rsvp">RSVP</a>
    </header>
    <section class="td-hero">
        <div class="td-copy">
            <svg class="td-palm" viewBox="0 0 80 140" aria-hidden="true"><path d="M40 140 V48 M40 52 C18 40 8 22 12 8 M40 52 C62 40 72 22 68 8 M40 48 C22 36 20 18 28 6 M40 48 C58 36 60 18 52 6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            <p class="td-kicker">Slow down — you are by the water now</p>
            <h1><span data-text="couple.partner1"></span> &amp; <span data-text="couple.partner2"></span></h1>
            <p class="td-script">from the church bells to the tide</p>
            <p class="td-meta"><span data-text="date"></span> · <span data-text="venueName"></span></p>
            <div class="td-cta">
                <a class="td-btn" href="#rsvp">Count us in — RSVP</a>
                <a class="td-btn td-btn-ghost" href="#events">The celebrations</a>
            </div>
        </div>
        <figure class="td-frame">
            <img data-src="heroImage" alt="">
            <figcaption>the sea kept the first secret</figcaption>
        </figure>
    </section>
    <section id="story" class="td-story">
        <h2>How the water turned</h2>
        <p data-text="story"></p>
    </section>
    <section id="events" class="td-events">
        <h2>Along the shore</h2>
        <div data-repeat="events">
            <article>
                <h3>{{item.name}}</h3>
                <p>{{item.date}} · {{item.time}}</p>
                <p>{{item.venue}}</p>
            </article>
        </div>
    </section>
    <section id="gallery" class="td-gal" data-repeat="gallery">
        <img src="{{item.src}}" alt="{{item.caption}}">
    </section>
    <section id="rsvp" class="td-rsvp">
        <h2>Count us in</h2>
        <form class="jod-rsvp">
            <input name="name" required placeholder="Name">
            <button type="submit">Send</button>
        </form>
        <p class="jod-thanks" hidden>We’ll keep a place by the water.</p>
    </section>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
