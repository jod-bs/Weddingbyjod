<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/images/logo/weddings_by_jod_icon.webp">
    <title>Split — Modern</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="sp" data-template-name="Split Screen" data-template-slug="split-screen">
    <aside class="sp-left">
        <img data-src="heroImage" data-alt="couple.full" alt="">
        <div class="sp-left-copy">
            <h1><span data-text="couple.partner1"></span><i>&amp;</i><span data-text="couple.partner2"></span></h1>
            <p data-text="dateShort"></p>
            <div class="sp-count">
                <b data-count="days">00</b><span>days</span>
            </div>
        </div>
    </aside>
    <main class="sp-right">
        <nav class="sp-nav">
            <a href="#story">Story</a>
            <a href="#events">Events</a>
            <a href="#venue">Venue</a>
            <a href="#rsvp">RSVP</a>
        </nav>
        <section id="story">
            <p class="sp-label">01</p>
            <h2>Our story</h2>
            <p data-text="story"></p>
        </section>
        <section id="events">
            <p class="sp-label">02</p>
            <h2>Events</h2>
            <ol data-repeat="events">
                <li>
                    <strong>{{item.name}}</strong>
                    <span>{{item.date}} · {{item.time}}</span>
                    <em>{{item.venue}}</em>
                </li>
            </ol>
        </section>
        <section id="venue">
            <p class="sp-label">03</p>
            <h2>Venue</h2>
            <p data-text="venueName"></p>
            <p class="sp-muted" data-text="coordinates"></p>
            <p data-text="dressCode"></p>
            <div class="sp-thumbs" data-repeat="gallery">
                <img src="{{item.src}}" alt="{{item.caption}}">
            </div>
        </section>
        <section id="rsvp">
            <p class="sp-label">04</p>
            <h2>RSVP</h2>
            <form class="jod-rsvp sp-form">
                <input name="name" placeholder="Name" required>
                <input name="email" placeholder="Email" type="email">
                <button type="submit">Send</button>
            </form>
            <p class="jod-thanks" hidden>Received.</p>
        </section>
    </main>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
