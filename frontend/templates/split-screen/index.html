<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="xnO7NqBUKzs8yHENmYSg-kk5ZwuXGTJ3Q1z01_vnYAc" />

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MW542D88');</script>
    <!-- End Google Tag Manager -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />
    <link rel="preload" as="image" href="/images/JOD%20Logo.png" />
    <title>Split — Modern</title>
    <link rel="canonical" href="https://weddingsbyjod.com/templates/split-screen/" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="sp" data-template-name="Split Screen" data-template-slug="split-screen">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MW542D88"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <aside class="sp-left">
        <img data-src="heroImage" data-alt="couple.full" alt="">
        <div class="sp-left-copy">
            <h1><span data-text="couple.partner1"></span><i>&amp;</i><span data-text="couple.partner2"></span></h1>
            <p data-text="dateShort"></p>
            <div class="sp-count">
                <b data-count="days">00</b><span>days</span>
            </div>
        </div>
    </aside>
    <main class="sp-right">
        <nav class="sp-nav">
            <a href="#story">Story</a>
            <a href="#events">Events</a>
            <a href="#venue">Venue</a>
            <a href="#rsvp">RSVP</a>
        </nav>
        <section id="story">
            <p class="sp-label">01</p>
            <h2>Our story</h2>
            <p data-text="story"></p>
        </section>
        <section id="events">
            <p class="sp-label">02</p>
            <h2>Events</h2>
            <ol data-repeat="events">
                <li>
                    <strong>{{item.name}}</strong>
                    <span>{{item.date}} · {{item.time}}</span>
                    <em>{{item.venue}}</em>
                </li>
            </ol>
        </section>
        <section id="venue">
            <p class="sp-label">03</p>
            <h2>Venue</h2>
            <p data-text="venueName"></p>
            <p class="sp-muted" data-text="coordinates"></p>
            <p data-text="dressCode"></p>
            <div class="sp-thumbs" data-repeat="gallery">
                <img src="{{item.src}}" alt="{{item.caption}}">
            </div>
        </section>
        <section id="rsvp">
            <p class="sp-label">04</p>
            <h2>RSVP</h2>
            <form class="jod-rsvp sp-form">
                <input name="name" placeholder="Name" required>
                <input name="email" placeholder="Email" type="email">
                <button type="submit">Send</button>
            </form>
            <p class="jod-thanks" hidden>Received.</p>
        </section>
    </main>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
