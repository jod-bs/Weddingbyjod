<head>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<body class="az" data-template-name="Azure" data-template-slug="azure">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MW542D88"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header class="az-sky">
        <nav>
            <a href="#tide">Tide</a>
            <a href="#chart">Chart</a>
            <a href="#harbour">Harbour</a>
            <a href="#rsvp">Come ashore</a>
        </nav>
        <p class="az-kicker">Horizon wedding · <span data-text="destination"></span></p>
        <div class="az-horizon">
            <h1><span data-text="couple.partner1"></span> <em>&amp;</em> <span data-text="couple.partner2"></span></h1>
            <figure>
                <img data-src="heroImage" alt="">
            </figure>
        </div>
        <p class="az-date" data-text="date"></p>
        <p class="az-coord" data-text="coordinates"></p>
    </header>
    <section id="tide" class="az-tide">
        <h2>Where the water turned.</h2>
        <p data-text="story"></p>
        <ol data-repeat="journey">
            <li>
                <strong>{{item.place}}</strong>
                <span>{{item.note}}</span>
            </li>
        </ol>
    </section>
    <section id="chart" class="az-chart">
        <h2>Tide chart</h2>
        <table>
            <thead>
                <tr><th>Event</th><th>When</th><th>Where</th></tr>
            </thead>
            <tbody data-repeat="events">
                <tr>
                    <td>{{item.name}}</td>
                    <td>{{item.date}} · {{item.time}}</td>
                    <td>{{item.venue}}</td>
                </tr>
            </tbody>
        </table>
    </section>
    <section id="harbour" class="az-harbour">
        <h2>Harbour notes</h2>
        <p data-text="venueName"></p>
        <p data-text="dressCode"></p>
        <div class="az-mosaic" data-repeat="gallery">
            <img src="{{item.src}}" alt="{{item.caption}}">
        </div>
    </section>
    <section id="rsvp" class="az-rsvp">
        <h2>Come ashore</h2>
        <form class="jod-rsvp">
            <input name="name" required placeholder="Name">
            <button type="submit">I’m on the tide</button>
        </form>
        <p class="jod-thanks" hidden>Your name is on the chart.</p>
    </section>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
