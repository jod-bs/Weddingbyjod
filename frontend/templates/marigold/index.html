<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="/images/logo/weddings_by_jod_icon.webp">
    <title>Marigold</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="mg" data-template-name="Marigold" data-template-slug="marigold">
    <header class="mg-hero">
        <nav>
            <a href="#haldi">Haldi</a>
            <a href="#mala">Mala</a>
            <a href="#sun">Sun</a>
            <a href="#rsvp">I’m in</a>
        </nav>
        <p>HALDI MORNING</p>
        <h1><span data-text="couple.partner1"></span><br><span data-text="couple.partner2"></span></h1>
        <p class="mg-when" data-text="date"></p>
    </header>
    <section id="haldi" class="mg-note">
        <h2>Turmeric, laughter, open palms.</h2>
        <p data-text="storyShort"></p>
        <p data-text="story"></p>
    </section>
    <section id="mala" class="mg-mala">
        <h2>The garland of days</h2>
        <div class="mg-string" data-repeat="events">
            <article>
                <i></i>
                <h3>{{item.name}}</h3>
                <p>{{item.date}}</p>
                <p>{{item.time}} · {{item.venue}}</p>
            </article>
        </div>
    </section>
    <section id="sun" class="mg-sun" data-repeat="gallery">
        <img src="{{item.src}}" alt="{{item.caption}}">
    </section>
    <section id="rsvp" class="mg-rsvp">
        <h2>Come yellow</h2>
        <form class="jod-rsvp">
            <input name="name" required placeholder="Your name">
            <button type="submit">Count me in</button>
        </form>
        <p class="jod-thanks" hidden>We’ll save you a marigold.</p>
    </section>
    <script src="/js/wedding-data.js"></script>
    <script src="/js/preview-toolbar.js"></script>
</body>
</html>
